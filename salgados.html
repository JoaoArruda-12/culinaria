html id="salgados-html"
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Salgados | Sabores da Casa</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, sans-serif;
    background:#eef5ff;
}

/* Cabeçalho */
header{
    background:linear-gradient(to right,#1565c0,#42a5f5);
    color:white;
    text-align:center;
    padding:35px;
}

header h1{
    font-size:40px;
}

/* Menu */
nav{
    background:#1976d2;
    text-align:center;
    padding:15px;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 15px;
    font-weight:bold;
}

/* Conteúdo */
.container{
    width:90%;
    margin:auto;
    padding:40px 0;
}

.galeria{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:30px;
}

.card{
    width:320px;
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 5px 18px rgba(0,0,0,0.15);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-10px);
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.card h2{
    text-align:center;
    color:#1565c0;
    padding:15px;
}

/* Botão */
.botao{
    display:block;
    text-align:center;
    width:220px;
    margin:40px auto 0;
    background:#1e88e5;
    color:white;
    padding:14px;
    border-radius:12px;
    text-decoration:none;
    font-weight:bold;
    transition:0.3s;
}

.botao:hover{
    background:#1565c0;
}

/* Rodapé */
footer{
    background:#1565c0;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:40px;
}
</style>
</head>
<body>

<header>
    <h1>🍔 Salgados</h1>
    <p>Os melhores pratos salgados para você</p>
</header>

<nav>
    <a href="index.html">Início</a>
    <a href="receitas-salgados.html">Receitas</a>
</nav>

<div class="container">

    <div class="galeria">

        <div class="card">
            <img src="macarrão ao molho branco.jpg">
            <h2>Macarrão Cremoso</h2>
        </div>

        <div class="card">
            <img src="ai-generated-freshly-fried-gourmet-french-fries-a-crunchy-and-unhealthy-snack-generated-by-ai-photo.jpg">
            <h2>Batata Frita</h2>
        </div>

        <div class="card">
            <img src="Hamburguer-artesanal.webp">
            <h2>Hambúrguer</h2>
        </div>

        <div class="card">
            <img src="lasanha-bolonhesa-na-pressao.jpg">
            <h2>Lasanha</h2>
        </div>

    </div>

    <a href="receitas-salgados.html" class="botao">
        Ver Receitas dos Salgados
    </a>

</div>

<footer>
    <p>© 2026 Sabores da Casa 💙</p>
</footer>

</body>
</html>
